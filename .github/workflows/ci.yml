name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install dependencies
        run: pnpm install

      - name: Syntax check (host half)
        run: node --check src/host/index.js && node --check src/host/routes.js && node --check src/host/patch-editor.js && node --check src/host/mcp-config.js && node --check src/host/loopback.js

      - name: Build client bundle
        run: pnpm run build

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test
