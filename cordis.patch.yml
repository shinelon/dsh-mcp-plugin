# @local/mcp-manager bundle patch: inserts the dual-face plugin row into the
# web profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field). The node half (exports ".") runs in the host process
# (/mcp-manager/* HTTP routes over the profile patch document), and the
# dsh.client declaration in package.json makes the browser half
# (exports "./client", served at /plugins/<id>/client.js) register the
# "MCP 服务" settings section in the web GUI.
- insert:
    - id: mcp-manager
      name: '@local/mcp-manager'
